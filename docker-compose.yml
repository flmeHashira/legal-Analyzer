services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - shared-data:/app/uploads
    depends_on:
      - parser
    environment:
      - PARSER_URL=http://parser:4000

  parser:
    build: ./parser
    ports:
      - "4000:4000"
    volumes:
      - ./parser:/app
      - shared-data:/app/uploads
    # No environment vars needed for Presidio anymore

volumes:
  shared-data: